name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest

      - name: Test
        run: go test ./...

      - name: Known vulnerabilities
        # govulncheck reports what the code actually reaches, so an unused
        # package in a dependency does not fail the build for everybody.
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Test with the race detector
        # The race detector needs cgo, so this job turns it back on for this
        # step only. Release binaries stay static.
        run: CGO_ENABLED=1 go test -race ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund

      - name: Translations are complete in every language
        run: npm run check:i18n

      - name: Known vulnerabilities
        # Dev dependencies do not ship, so only what reaches a browser counts.
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc -b

      - name: Build
        # build:only, not vite build: it also clears stale assets and copies
        # llms.txt in, which the panel serves.
        run: npm run build:only

  interface:
    name: Interface
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the panel
        run: make build

      - name: Install the browser
        run: npm --prefix web exec -- playwright install --with-deps chromium

      - name: Interface test
        # Runs against the binary built above, serving the frontend embedded in
        # it: what is tested is what ships.
        run: npm --prefix web run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the panel
        run: make build

      - name: Smoke test the panel
        run: ./test/smoke/panel.sh

      - name: Smoke test the installer
        # Checks the scripts and the manifests. It never installs anything:
        # the uninstaller is only ever run with --dry-run.
        run: ./test/smoke/installer.sh

      - name: Build the container image
        run: |
          docker build \
            --build-arg VERSION=ci \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            -t skifity:ci .
